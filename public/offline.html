<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sin conexión - El Ganso Turnos</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e1b4b, #0f172a);
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container { text-align: center; padding: 2rem; }
    .icon {
      width: 80px; height: 80px; margin: 0 auto 1.5rem;
      background: rgba(79, 70, 229, 0.3);
      border-radius: 1rem;
      display: flex; align-items: center; justify-content: center;
    }
    h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
    p { color: #a5b4fc; margin-bottom: 2rem; }
    button {
      background: #4f46e5; color: white; border: none;
      padding: 0.75rem 2rem; border-radius: 0.75rem;
      font-size: 1rem; cursor: pointer;
    }
    button:hover { background: #4338ca; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">
      <svg width="40" height="40" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M18.364 5.636a9 9 0 010 12.728m-3.536-3.536a4 4 0 010-5.656M6 18L18 6" />
      </svg>
    </div>
    <h1>Sin conexión</h1>
    <p>No hay conexión a internet. Comprueba tu red e inténtalo de nuevo.</p>
    <button onclick="location.reload()">Reintentar</button>
  </div>
</body>
</html>
